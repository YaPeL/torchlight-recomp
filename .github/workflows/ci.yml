# Public CI, without the game (docs/release-pipeline.md 5.3): the patched SDK and OGRE, the
# libraries and tests (preset linux-amd64-nogame), and the packaged replay checked in clean
# containers; on Windows the SDK and OGRE, and the libraries and tests (preset win-amd64-nogame);
# on macOS (Apple Silicon) the same with preset mac-arm64-nogame. No secrets. To save Actions
# minutes it runs on pushes to and pull requests into develop (where the work is integrated) and
# main (releases), and by hand; the SDK and OGRE are built once per key
# (tools/deps/key.sh), published from either branch as assets of the one prerelease "deps"
# (tools/deps/store.sh), and reused (docs/release-pipeline.md, 5.9).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPS_DIR: /deps

jobs:
  deps:
    name: SDK and OGRE
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    # Writes only to publish the builds (decision 5), on pushes to develop or main.
    permissions:
      contents: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git zstd gh
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
      - id: key
        name: Key
        run: echo "key=$(tools/deps/key.sh)" >> "$GITHUB_OUTPUT"
      # The prune below deletes from the store: its tests (fake store, fake branches) go first.
      - name: Test the store's prune
        run: bash tools/deps/test_store.sh
      # The store keeps only what main and develop use: old deps-<key> releases are moved into it,
      # and what neither branch uses is removed (tools/deps/store.sh prune). By hand it moves but
      # only reports what it would remove.
      - name: Prune the dependency store
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools/deps/store.sh prune
          ${{ github.event_name == 'workflow_dispatch' && '--no-delete' || '' }}
      - id: published
        name: Already published?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tools/deps/store.sh has linux "${{ steps.key.outputs.key }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - id: cache
        if: steps.published.outputs.found != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-linux-amd64-ubuntu22.04-${{ steps.key.outputs.key }}
      - name: Build
        if: steps.published.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sh tools/deps/ubuntu_toolchain.sh
          tools/deps/build_sdk.sh "$DEPS_DIR/sdk"
          tools/deps/build_ogre.sh "$DEPS_DIR/ogre"
      # A push to develop and one to main with the same key (a freeze merge) can both get here: both
      # upload the same archives (--clobber), so either order leaves them in place.
      - name: Publish
        if: >-
          steps.published.outputs.found != 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C "$DEPS_DIR" -cf - sdk | zstd -19 -T0 > sdk-linux-amd64.tar.zst
          tar -C "$DEPS_DIR" -cf - ogre | zstd -19 -T0 > ogre-linux-amd64.tar.zst
          tools/deps/store.sh publish linux "${{ steps.key.outputs.key }}" \
            sdk-linux-amd64.tar.zst ogre-linux-amd64.tar.zst

  test:
    name: Build and test (no game)
    needs: deps
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git zstd gh
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
      - name: Toolchain
        run: sh tools/deps/ubuntu_toolchain.sh
      - id: published
        name: Published dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=${{ needs.deps.outputs.key }}
          mkdir -p "$DEPS_DIR"
          if tools/deps/store.sh fetch linux "$key" /tmp/deps; then
            for f in /tmp/deps/*.tar.zst; do zstd -dc "$f" | tar -C "$DEPS_DIR" -xf -; done
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.found != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-linux-amd64-ubuntu22.04-${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true
      - name: Configure
        run: >-
          cmake --preset linux-amd64-nogame -DCMAKE_PREFIX_PATH="$DEPS_DIR/sdk"
          -DTORCHLIGHT_OGRE_INSTALL="$DEPS_DIR/ogre"
      - name: Build
        run: cmake --build --preset linux-amd64-nogame --parallel
      - name: Test
        run: ctest --test-dir out/build/linux-amd64-nogame --output-on-failure
      - name: Package replay
        run: |
          cmake --install out/build/linux-amd64-nogame --prefix /tmp/install
          cmake --install out/build/linux-amd64-nogame --prefix /tmp/install --component tools
          packaging/linux/get_tools.sh /tmp/tools
          PATH=/tmp/tools:$PATH CXX=clang++ packaging/linux/make_appimage.sh /tmp/install \
            replay-x86_64.AppImage replay
          /tmp/install/bin/synthetic_capture synthetic.tlcap
      # Nothing of the game: the replay tool and a synthetic capture.
      - uses: actions/upload-artifact@v7
        with:
          name: replay-appimage
          path: |
            replay-x86_64.AppImage
            synthetic.tlcap
          retention-days: 3

  # Windows: the same scheme. The SDK and OGRE come from tools/build-deps/windows.ps1 with LLVM from
  # windows_toolchain.ps1, keyed by `key.sh windows` and published in the same store; zip files
  # (Windows' tar writes and reads them; it has no zstd). The Linux job prunes for both.
  deps-windows:
    name: SDK and OGRE (Windows)
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    env:
      DEPS_DIR: C:\deps
    steps:
      - uses: actions/checkout@v7
      - id: key
        name: Key
        shell: bash
        # The configurations come from key.sh, which hashes them: changing one changes the key.
        run: |
          echo "key=$(tools/deps/key.sh windows)" >> "$GITHUB_OUTPUT"
          read -r ogre sdk <<< "$(tools/deps/key.sh windows-configs)"
          echo "ogre_configs=$ogre" >> "$GITHUB_OUTPUT"
          echo "sdk_configs=$sdk" >> "$GITHUB_OUTPUT"
      - id: published
        name: Already published?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tools/deps/store.sh has windows "${{ steps.key.outputs.key }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - id: cache
        if: steps.published.outputs.found != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-windows-amd64-windows2022-${{ steps.key.outputs.key }}
      - name: Build
        if: steps.published.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          tools/build-deps/windows_toolchain.ps1 -Destination C:\llvm
          tools/build-deps/windows.ps1 -Prefix "$env:DEPS_DIR\ogre" -SdkPrefix "$env:DEPS_DIR\sdk" `
            -WorkDir C:\deps-work -Configs ${{ steps.key.outputs.ogre_configs }} `
            -SdkConfigs ${{ steps.key.outputs.sdk_configs }} -LlvmBin C:\llvm\bin
      # As the Linux job's: a concurrent run with the same key may have published it first.
      - name: Publish
        if: >-
          steps.published.outputs.found != 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = '${{ steps.key.outputs.key }}'
          tar -a -cf sdk-windows-amd64.zip -C $env:DEPS_DIR sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tar -a -cf ogre-windows-amd64.zip -C $env:DEPS_DIR ogre
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Git Bash (shell: bash), not whatever `bash` pwsh would find first on the runner.
      - name: Upload
        if: >-
          steps.published.outputs.found != 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools/deps/store.sh publish windows "${{ steps.key.outputs.key }}"
          sdk-windows-amd64.zip ogre-windows-amd64.zip

  test-windows:
    name: Build and test (Windows, no game)
    needs: deps-windows
    runs-on: windows-2022
    env:
      DEPS_DIR: C:\deps
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        shell: pwsh
        run: tools/build-deps/windows_toolchain.ps1 -Destination C:\llvm
      # Downloaded in Git Bash, unpacked in pwsh: there `tar` is Windows' own (bsdtar), which made the
      # zips; Git Bash's is GNU tar, which reads no zip.
      - id: published
        name: Published dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tools/deps/store.sh fetch windows "${{ needs.deps-windows.outputs.key }}" deps-download; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack
        if: steps.published.outputs.found == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:DEPS_DIR | Out-Null
          foreach ($f in Get-ChildItem "deps-download\*.zip") {
            tar -xf $f.FullName -C $env:DEPS_DIR
            if ($LASTEXITCODE) { exit 1 }
          }
      - if: steps.published.outputs.found != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-windows-amd64-windows2022-${{ needs.deps-windows.outputs.key }}
          fail-on-cache-miss: true
      # The MSVC environment, with LLVM first in PATH, for the configure, build and test steps.
      - name: Environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /d /s /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
          "C:\llvm\bin" >> $env:GITHUB_PATH
      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset win-amd64-nogame "-DCMAKE_PREFIX_PATH=$env:DEPS_DIR\sdk"
          "-DTORCHLIGHT_OGRE_INSTALL=$env:DEPS_DIR\ogre"
      - name: Build
        shell: pwsh
        run: cmake --build --preset win-amd64-nogame --parallel
      # Tests labeled opengl33 are the GL3+ runs of the backend tests, which need OpenGL 3.3 and the
      # runner (no GPU) lacks; their Direct3D 11 runs (WARP) run here. The label and the reason are
      # with the tests (src/backend/CMakeLists.txt); release.yml leaves them out too.
      - name: Test
        shell: pwsh
        run: ctest --test-dir out/build/win-amd64-nogame --output-on-failure -LE opengl33

  # macOS on Apple Silicon: the same scheme on the macos-26 runner (pinned, as ubuntu-24.04 is), with
  # Apple's clang from the runner's Command Line Tools; keyed by `key.sh macos`, published as
  # tar.zst like Linux. The Linux job prunes for all three platforms.
  deps-macos:
    name: SDK and OGRE (macOS)
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      # Outside the workspace, which actions/checkout cleans; set here because a job's env cannot
      # read the runner context.
      - name: Locations
        run: echo "DEPS_DIR=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
      - id: key
        name: Key
        run: echo "key=$(tools/deps/key.sh macos)" >> "$GITHUB_OUTPUT"
      - id: published
        name: Already published?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tools/deps/store.sh has macos "${{ steps.key.outputs.key }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - id: cache
        if: steps.published.outputs.found != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-macos-arm64-macos26-${{ steps.key.outputs.key }}
      - name: Tools
        run: |
          command -v ninja > /dev/null || brew install ninja
          command -v zstd > /dev/null || brew install zstd
      - name: Build
        if: steps.published.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/deps/build_sdk.sh "$DEPS_DIR/sdk"
          tools/deps/build_ogre.sh "$DEPS_DIR/ogre"
      # As the Linux job's: a concurrent run with the same key may have published it first.
      - name: Publish
        if: >-
          steps.published.outputs.found != 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C "$DEPS_DIR" -cf - sdk | zstd -19 -T0 > sdk-macos-arm64.tar.zst
          tar -C "$DEPS_DIR" -cf - ogre | zstd -19 -T0 > ogre-macos-arm64.tar.zst
          tools/deps/store.sh publish macos "${{ steps.key.outputs.key }}" \
            sdk-macos-arm64.tar.zst ogre-macos-arm64.tar.zst

  test-macos:
    name: Build and test (macOS, no game)
    needs: deps-macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Locations
        run: echo "DEPS_DIR=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          command -v ninja > /dev/null || brew install ninja
          command -v zstd > /dev/null || brew install zstd
      - id: published
        name: Published dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DEPS_DIR"
          download=$RUNNER_TEMP/deps-download
          if tools/deps/store.sh fetch macos "${{ needs.deps-macos.outputs.key }}" "$download"; then
            for f in "$download"/*.tar.zst; do zstd -dc "$f" | tar -C "$DEPS_DIR" -xf -; done
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.found != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-macos-arm64-macos26-${{ needs.deps-macos.outputs.key }}
          fail-on-cache-miss: true
      - name: Configure
        run: >-
          cmake --preset mac-arm64-nogame -DCMAKE_PREFIX_PATH="$DEPS_DIR/sdk"
          -DTORCHLIGHT_OGRE_INSTALL="$DEPS_DIR/ogre"
      - name: Build
        run: cmake --build --preset mac-arm64-nogame --parallel
      # Tests labeled opengl33 are the GL3+ runs of the backend tests: the runner's virtual GPU gives
      # no OpenGL 3 context ("OpenGL 3.0 is not supported in initialiseContext", 2026-10-10), so
      # they are left out here as on Windows (the label and the reason are with the tests,
      # src/backend/CMakeLists.txt). They pass on Apple Silicon Macs (GL 4.1).
      - name: Test
        run: ctest --test-dir out/build/mac-arm64-nogame --output-on-failure -LE opengl33
      # A test that crashed leaves macOS's crash report (the stack of every thread) in the user's
      # DiagnosticReports; nothing of the game is built here.
      - name: Crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '*.ips' -newer CMakePresets.json \
            -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2> /dev/null || true
          ls -la "$RUNNER_TEMP/crash-reports"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-crash-reports
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: warn
          retention-days: 7

  package-check:
    name: Packaged replay on ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: Host packages (what an AppImage takes from the system)
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xvfb xauth libgl1 libegl1 libgl1-mesa-dri libx11-6 libx11-xcb1 libxrandr2 libsm6 libice6 \
              libwayland-client0 libwayland-egl1 zlib1g
          else
            pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth mesa libx11 libxrandr libsm libice wayland zlib \
              which
          fi
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/linux
      - uses: actions/download-artifact@v8
        with:
          name: replay-appimage
      - name: Check
        run: |
          chmod +x replay-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a packaging/linux/check_appimage.sh \
            replay-x86_64.AppImage synthetic.tlcap
